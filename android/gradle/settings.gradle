// 장학금헌터 안드로이드 (애드몹 SDK 를 쓰기 위해 Gradle 로 빌드). 소스는 android/src, android/res 를 그대로 쓴다.
pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
